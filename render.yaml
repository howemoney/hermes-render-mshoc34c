# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render, pre-baked with Render tools.
# https://github.com/NousResearch/hermes-agent
#
# Single web service built from the local Dockerfile, which extends the
# upstream Hermes image with:
#   - The official render-oss/skills bundle, pinned at a commit
#   - The Render MCP server pre-registered in config.yaml at boot
#     with the full MCP tool catalog available to the provided API key
#
# Inside the container the gateway runs in the foreground and the
# dashboard runs as a background side-process (HERMES_DASHBOARD=1).
# Render's public URL serves the dashboard on port 10000; persistent
# state lives on a 5 GB disk mounted at /opt/data (HERMES_HOME default).
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  - type: web
    name: hermes
    runtime: docker
    region: oregon
    plan: standard
    # Render builds the image from this repo's Dockerfile on every deploy.
    # The Dockerfile FROMs the pinned upstream Hermes image, adds Render
    # tooling + the skill bundle, and sets ENTRYPOINT to our bootstrap wrapper — so
    # no `dockerCommand` override is needed here.
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/status

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5

    envVars:
      # The Blueprint only carries vars that change how the container boots
      # or that wire up the bundled Render tools. All provider keys, tool
      # keys, and chat platform tokens are set through the Hermes dashboard
      # (API Keys tab), which writes them to /opt/data/.env on the disk.

      # Dashboard, supervised by s6 as its own service. Render only routes to
      # port 10000, so the bind host must be 0.0.0.0 — which engages Hermes'
      # dashboard auth gate.
      #
      # The gate is FAIL-CLOSED as of Hermes v0.20.0: on a non-loopback bind
      # with no auth provider registered, `hermes dashboard` refuses to bind
      # at all, nothing listens on 10000, and the deploy fails its health
      # check. The old `--insecure` escape hatch is now accepted-and-ignored,
      # so the OIDC settings below are REQUIRED, not optional.
      - key: HERMES_DASHBOARD
        value: "1"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "10000"

      # Auth provider: the bundled self-hosted OIDC plugin, pointed at the
      # Cloudflare Access tenant that already fronts hermes.howe.ceo. This
      # keeps a single Cloudflare identity — no second password, no third-party
      # account — and Access remains the internet-facing gate.
      #
      # Provisioned as an Access "SaaS application" with the OIDC protocol
      # (Zero Trust > Access controls > Applications), redirect URL
      # <HERMES_DASHBOARD_PUBLIC_URL>/auth/callback. Cloudflare issues a
      # client_id + client_secret and serves per-application OIDC discovery at
      #   https://<team>.cloudflareaccess.com/cdn-cgi/access/sso/oidc/<client_id>
      # which is what the issuer below must be set to — the team-level
      # /.well-known/openid-configuration only carries issuer + jwks_uri and
      # has no authorization/token endpoints, so it will NOT work here.
      #
      # All three are `sync: false` so credentials live in the Render
      # Environment tab, never in this repo.
      - key: HERMES_DASHBOARD_OIDC_ISSUER
        sync: false
      - key: HERMES_DASHBOARD_OIDC_CLIENT_ID
        sync: false
      # Cloudflare Access is a confidential client. The upstream docs page
      # claims confidential clients are unsupported, but that note is stale —
      # plugins/dashboard_auth/self_hosted handles client_secret_basic /
      # client_secret_post and sends PKCE in both modes.
      - key: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
        sync: false

      # Session lifetime. The dashboard session cookie's Max-Age equals the
      # ID token's `exp` (routes.py: expires_in = exp - now), and by default
      # start_login requests only `openid profile email` — no offline_access —
      # so no refresh token is issued and the whole dashboard session silently
      # dies at ID-token expiry (observed live 2026-08-18: two expiries within
      # ~15 minutes; every cookie-gated /api call starts returning 401
      # {"reason":"no_cookie"} while the chat PTY websocket — authenticated
      # once at connect — keeps working). Requesting offline_access lets the
      # gate's refresh path (middleware _attempt_refresh) renew the session.
      # Pair this with "Enable refresh tokens" ON the Access SaaS application
      # (Zero Trust > Access > Applications > <app> > Settings) and consider
      # raising the app's session/ID-token duration there too.
      - key: HERMES_DASHBOARD_OIDC_SCOPES
        value: "openid profile email offline_access"

      # The dashboard derives its OAuth callback from X-Forwarded-* headers by
      # default. Behind the Render edge plus the Cloudflare proxy that chain
      # isn't reliable, so declare the public URL explicitly — the callback
      # becomes "<this value>/auth/callback" verbatim, which must match the
      # redirect URL registered on the Access SaaS app.
      - key: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://hermes.howe.ceo"
      # Exposes a Chat tab in the dashboard that embeds the full Hermes TUI
      # over a server-side PTY + xterm.js. This is how you chat with the
      # agent without a real terminal on the host side.
      - key: HERMES_DASHBOARD_TUI
        value: "1"

      # Generated once at first deploy. Reuse this value as API_SERVER_KEY
      # in the dashboard if you later opt into the OpenAI-compatible API
      # server (API_SERVER_ENABLED=true).
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # Bearer token for the pre-registered Render MCP server. Generate
      # at https://dashboard.render.com/u/*/settings#api-keys and paste
      # into the dashboard's Environment tab. The boot-time patcher
      # reads ${RENDER_MCP_API_KEY} into config.yaml lazily, so you can
      # rotate by editing the env var and restarting — no rebuild needed.
      #
      # Named `RENDER_MCP_API_KEY` rather than the stock `RENDER_API_KEY`
      # to avoid accidental auto-auth if someone later installs the
      # `render` CLI. This is the same kind of Render API key; the Render
      # account role behind the key determines what the agent can do.
      - key: RENDER_MCP_API_KEY
        sync: false
